<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#17202a;--mut:#5d6b7a;--ac:#0f766e;--acx:#fff;--bd:#dde3ea;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--wn:#a16207;--wnb:#fef3c7;color-scheme:light;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--card:#18212b;--tx:#e8edf2;--mut:#93a1b0;--ac:#2dd4bf;--acx:#06201d;--bd:#2a3644;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717;--wn:#fbbf24;--wnb:#3a2c0a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141b;--card:#18212b;--tx:#e8edf2;--mut:#93a1b0;--ac:#2dd4bf;--acx:#06201d;--bd:#2a3644;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717;--wn:#fbbf24;--wnb:#3a2c0a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin:8px 0;font:inherit;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);text-align:center;font-weight:600}
.row{display:flex;gap:8px}.row .btn{margin:8px 0;text-align:center}
select,input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;margin:0 6px 6px 0;background:var(--bd);color:var(--mut)}
.tag.c{background:var(--wnb);color:var(--wn)}.tag.d{background:var(--wnb);color:var(--wn)}.tag.x{background:var(--nob);color:var(--no)}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 10px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}.opt.sel{border-color:var(--ac);border-width:2px}
.note{background:var(--wnb);color:var(--tx);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92rem}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.ans{color:var(--ok);font-weight:600}.top{display:flex;justify-content:space-between;align-items:center}
.ecg{display:block;width:100%;border-radius:8px;margin:4px 0 10px;background:#fff}
footer{max-width:720px;margin:0 auto;padding:4px 16px 28px;color:var(--mut);font-size:.82rem}footer ul{margin:4px 0 0;padding-left:18px}
.lk{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:6px 0}
</style></head><body><div id="app"></div><footer id="src"></footer>

{"id":131,"sec":"Clinical Cases & Scenarios","q":"A patient presents with chest pain and shortness of breath. What is the nurse’s priority assessment?","o":["Pain scale","Vital signs","Medical history","Diet"],"a":1,"s":"","n":"","r":"hh"},{"id":132,"sec":"Clinical Cases & Scenarios","q":"A patient has hyperkalemia. What is the most serious complication the nurse should monitor for?","o":["Muscle weakness","Nausea","Cardiac arrest","Polyuria"],"a":2,"s":"","n":"","r":"hh"},{"id":133,"sec":"Clinical Cases & Scenarios","q":"A patient presents to the ER with severe abdominal pain. What is the nurse’s priority triage action?","o":["Take vital signs","Give pain medication","Obtain past medical history","Start IV fluids"],"a":0,"s":"","n":"","r":"hh"},{"id":134,"sec":"Clinical Cases & Scenarios","q":"A patient comes with sudden, severe abdominal pain and guarding. Which action should the nurse take first?","o":["Prepare for surgery","Assess vital signs and pain","Give oral analgesics","Ask about last meal"],"a":1,"s":"","n":"","r":"hh"},{"id":135,"sec":"Clinical Cases & Scenarios","q":"A patient has chest pain and diaphoresis. What is the nurse’s first action?","o":["Give oxygen","Take vital signs","Start IV","Give pain medication"],"a":0,"s":"","n":"","r":"hh"},{"id":136,"sec":"Clinical Cases & Scenarios","q":"A 65-year-old patient is admitted after an accident. In assessing levels of consciousness, which response is checked first?","o":["Eye response","Verbal response","Motor response","Reflexes"],"a":0,"s":"","n":"","r":"hh"},{"id":137,"sec":"Clinical Cases & Scenarios","q":"A patient is in a motor vehicle accident. You notice tracheal deviation and asymmetrical chest movement. What is the likely diagnosis?","o":["Pneumonia","Hemothorax","Tension pneumothorax","Pulmonary edema"],"a":2,"s":"","n":"","r":"hh"},{"id":138,"sec":"Clinical Cases & Scenarios","q":"A patient recently had a blood clot. What is the best nursing action to prevent cardiogenic shock during the acute phase?","o":["Give fluids","Monitor vitals only","Give oxygen","Restrict activity"],"a":2,"s":"","n":"","r":"hh"},{"id":139,"sec":"Clinical Cases & Scenarios","q":"A patient presents with polyuria, diaphoresis, and confusion. What should the nurse check first?","o":["Blood glucose","Blood pressure","Temperature","Heart rate"],"a":0,"s":"","n":"","r":"hh"},{"id":140,"sec":"Clinical Cases & Scenarios","q":"A patient takes ibuprofen and presents with pallor, headache, dizziness, increased HR, and low BP. What type of complication is this?","o":["Allergic reaction","Hypovolemic / circulatory shock","Infection","Bradycardia"],"a":1,"s":"","n":"","r":"hh"},{"id":141,"sec":"Clinical Cases & Scenarios","q":"A pregnant woman has high BP, seizures, periorbital bruising, and nuchal rigidity. What should the nurse suspect?","o":["Eclampsia","Meningitis & lumbar puncture","Preeclampsia","Gestational diabetes"],"a":0,"s":"c","n":"Hypertension plus seizures in pregnancy = eclampsia. The listed periorbital bruising and nuchal rigidity do not fit. (Source key said meningitis.) Doubtful question.","r":"hh"},{"id":142,"sec":"Clinical Cases & Scenarios","q":"A woman has a clot (or cardiac event) but pain in jaw. What type of pain is this?","o":["Local pain","Referred pain","Neuropathic pain","Phantom pain"],"a":1,"s":"","n":"","r":"hh"},{"id":143,"sec":"Clinical Cases & Scenarios","q":"A patient with ischemic stroke receives tPA. What is the most important nursing action?","o":["Monitor bleeding","Give anticoagulants","Give aspirin immediately","Place patient flat"],"a":0,"s":"","n":"","r":"hh"},{"id":144,"sec":"Clinical Cases & Scenarios","q":"Patient has impaired cerebral tissue perfusion after stroke. Which intervention is appropriate?","o":["Elevate head of bed 30 degrees","Give Mannitol hydration","Keep patient flat","Limit fluids"],"a":0,"s":"","n":"","r":"hh"},{"id":145,"sec":"Clinical Cases & Scenarios","q":"A patient presents with chest pain and sweating. What is the nurse’s first action?","o":["Take vital signs","Give oxygen","Give pain medication","Obtain history"],"a":1,"s":"","n":"","r":"hh"},{"id":146,"sec":"Clinical Cases & Scenarios","q":"A mother asks how to know if her baby has pyloric stenosis. What is the most characteristic sign?","o":["Projectile vomiting","Diarrhea","Constipation","Cough"],"a":0,"s":"","n":"","r":"hh"},{"id":147,"sec":"Clinical Cases & Scenarios","q":"A patient is anxious. When is the best time for the nurse to talk to her?","o":["Before surgery","During surgery","After surgery","Whenever"],"a":0,"s":"","n":"","r":"hh"},{"id":148,"sec":"Clinical Cases & Scenarios","q":"A child is involved in a trauma. Oxygen saturation is 80%, blood pressure 70/40 mmHg. What is the Glasgow Coma Scale (GCS) assessment based on?","o":["Eye response","Verbal response","Motor response","All of the above"],"a":3,"s":"","n":"","r":"hh"},{"id":149,"sec":"Clinical Cases & Scenarios","q":"A patient has a fracture of the 5th cervical vertebra (C5). What should the nurse do before moving the patient?","o":["Ask the patient to stand","Perform neurological assessment","Apply a warm pack","Start IV fluids"],"a":1,"s":"","n":"","r":"hh"},{"id":150,"sec":"Clinical Cases & Scenarios","q":"A patient arrives after a motor vehicle accident. What is the priority nursing intervention?","o":["Assess pain","Support the head and neck","Give oxygen","Take vitals"],"a":1,"s":"","n":"","r":"hh"},{"id":151,"sec":"Clinical Cases & Scenarios","q":"A patient is unresponsive and having trouble breathing. What should the nurse start first?","o":["Oxygen mask","Chest compressions","Check BP only","Give morphine"],"a":1,"s":"","n":"","r":"hh"},{"id":152,"sec":"Clinical Cases & Scenarios","q":"At what blood pressure reading is hypertension diagnosed?","o":["120/80 mmHg","140/90 mmHg","130/70 mmHg","110/60 mmHg"],"a":1,"s":"","n":"","r":"hh"},{"id":153,"sec":"Clinical Cases & Scenarios","q":"A patient has severe diarrhea. What is the most important sign the nurse should monitor?","o":["Dry mouth","Dizziness","Dehydration","Hypotension"],"a":2,"s":"","n":"","r":"hh"},{"id":154,"sec":"Clinical Cases & Scenarios","q":"A 25-year-old male is brought to the ER following a motor vehicle accident. He is conscious but complaining of severe shortness of breath. What is the priority nursing intervention?","o":["Obtain a full set of vital signs","Administer oxygen via a non-rebreather mask","Auscultate lung sounds","Check the patient’s oxygen saturation"],"a":1,"s":"","n":"","r":"hh"},{"id":155,"sec":"Clinical Cases & Scenarios","q":"A patient is experiencing postpartum bleeding. What is the nurse’s priority action?","o":["Give IV fluids","Assess bleeding and notify the physician","Monitor vitals only","Start oxygen"],"a":1,"s":"","n":"","r":"hh"},{"id":156,"sec":"Clinical Cases & Scenarios","q":"A patient eats only 20% of their meal and says they are too tired to finish. What should the nurse do?","o":["Make the patient finish the meal","Take the tray away and let the patient rest","Force the patient to eat protein","Make the patient eat later"],"a":1,"s":"","n":"","r":"hh"},{"id":157,"sec":"Clinical Cases & Scenarios","q":"An elderly patient presents with stroke symptoms. What is the nurse’s first action?","o":["Administer aspirin","Start IV fluids","Stat CT scan","Prepare for tissue"],"a":2,"s":"","n":"","r":"hh"},{"id":158,"sec":"Clinical Cases & Scenarios","q":"Scenario: Patient removes dressing by herself and has 4-point restraints ordered. What is the nurse’s priority action?","o":["Check circulation every 15 min","Entertain the patient","Ignore","Remove restraints"],"a":0,"s":"","n":"","r":"hh"},{"id":159,"sec":"Clinical Cases & Scenarios","q":"When transporting a patient who is receiving a blood transfusion, what is the nurse’s priority for safety?","o":["Leave the blood in the fridge until needed","Hang the blood for up to 6 hours","Stay with the patient for the first 15 minutes to monitor for reactions","Transport without monitoring"],"a":2,"s":"","n":"","r":"hh"},{"id":160,"sec":"Clinical Cases & Scenarios","q":"A patient is receiving enteral feeding. What is the priority nursing action?","o":["Elevate the head of the bed ≥30°","Turn patient on left side","Check tube placement by auscultation only","Wrap the tube"],"a":0,"s":"","n":"","r":"hh"},{"id":161,"sec":"Clinical Cases & Scenarios","q":"A patient has a foot fracture. What should the nurse prioritize in assessment?","o":["Edema","Skin color","Pain","Sensation"],"a":1,"s":"","n":"","r":"hh"},{"id":162,"sec":"Clinical Cases & Scenarios","q":"An adult is brought to the emergency department after a motor vehicle accident. He is diagnosed with a closed cerebral fracture and shows signs of increased intracranial pressure (ICP). What is the nurse’s priority action?","o":["Administer IV mannitol 1 g as prescribed","Provide 20 L/min of oxygen","Elevate the head of the bed"],"a":2,"s":"","n":"","r":"hh"},{"id":163,"sec":"Clinical Cases & Scenarios","q":"A pregnant woman in her third trimester reports headache and high blood pressure. What is the most likely diagnosis?","o":["Gestational hypertension","Preeclampsia","Eclampsia","Chronic hypertension"],"a":1,"s":"","n":"","r":"hh"},{"id":164,"sec":"Clinical Cases & Scenarios","q":"A patient reports pain after surgery. What is the nurse’s priority action?","o":["Ignore the pain","Give a PRN opioid immediately","Assess pain and give medication as ordered","Wait for the patient to sleep"],"a":2,"s":"","n":"","r":"hh"},{"id":165,"sec":"Clinical Cases & Scenarios","q":"A patient has abdominal pain but no vomiting. What triage level should she be assigned?","o":["Triage 2","Triage 3","Triage 4","Triage 5"],"a":1,"s":"","n":"","r":"hh"},{"id":166,"sec":"Clinical Cases & Scenarios","q":"A patient comes after an 8-week miscarriage. What is the priority observation?","o":["Pain","Hemorrhage","Infection","Mood"],"a":1,"s":"","n":"","r":"hh"},{"id":167,"sec":"Clinical Cases & Scenarios","q":"A patient has constant pain. What should the nurse do?","o":["Ignore","Give PRN pain medication as ordered","Wait until patient requests again","Give scheduled meds only"],"a":1,"s":"","n":"","r":"hh"},{"id":168,"sec":"Clinical Cases & Scenarios","q":"Patient on continuous IV fluid. What is the priority intervention?","o":["Lower the bed","Elevate head of bed","Check IV bag once per shift","Measure urine output at end of shift"],"a":1,"s":"d","n":"Doubtful: the usual priority for continuous IV fluids is monitoring the site and signs of fluid overload.","r":"hh"},{"id":169,"sec":"Clinical Cases & Scenarios","q":"A patient has a cerebrovascular accident (CVA). What is the best position for the patient?","o":["Supine","Prone","Semi-Fowler 30°","Flat on bed"],"a":2,"s":"","n":"","r":"hh"},{"id":170,"sec":"Clinical Cases & Scenarios","q":"A patient who had abdominal surgery goes to the bathroom and the wound opens with intestines protruding. What is the nurse’s priority action?","o":["Try to push organs back in","Cover wound with sterile dressing","Leave wound open","Tie up the wound"],"a":1,"s":"","n":"","r":"hh"},{"id":171,"sec":"Clinical Cases & Scenarios","q":"A woman has just miscarried and has heavy bleeding. What is the first nursing action?","o":["Start IV fluids","Evaluate bleeding and notify physician","Give pain medication","Take vitals later"],"a":1,"s":"","n":"","r":"hh"},{"id":172,"sec":"Clinical Cases & Scenarios","q":"A patient has rapid breathing and muscle twitching. ABG results: pH 7.6, PaCO2 31, HCO3 25. What does this indicate?","o":["Metabolic acidosis","Metabolic alkalosis","Respiratory alkalosis, uncompensated","Respiratory acidosis"],"a":2,"s":"","n":"","r":"hh"},{"id":173,"sec":"Clinical Cases & Scenarios","q":"A patient arrives at the ER after a car accident with a head injury. What is the first nursing intervention?","o":["Check pupils","Immobilize the client’s head and neck","Take vital signs","Start IV fluids"],"a":1,"s":"","n":"","r":"hh"},{"id":174,"sec":"Clinical Cases & Scenarios","q":"A driver has a high-speed frontal collision without a seatbelt. What condition is most expected?","o":["Pneumothorax","Cardiac tamponade","Spinal fracture","Hemothorax"],"a":1,"s":"d","n":"Doubtful: blunt cardiac injury is possible, but other injuries are equally likely.","r":"hh"},{"id":175,"sec":"Clinical Cases & Scenarios","q":"A patient with tachypnea, cramps, tingling. ABG: pH 7.6, PO2 120, PaCO2 31, HCO3 25.","o":["Respiratory alkalosis, uncompensated","Metabolic alkalosis, partially compensated","Respiratory acidosis, partially compensated","Metabolic alkalosis, uncompensated"],"a":0,"s":"","n":"","r":"hh"},{"id":176,"sec":"Clinical Cases & Scenarios","q":"A patient has a leg fracture, and the doctor is applying a cast. During the application, the nurse must monitor the toes and ensure the following:","o":["Movement","Fluids/Perfusion/Sensation","Cyanosis (Bluish discoloration)","Temperature of the toes"],"a":3,"s":"d","n":"Unclear: after casting, check color, warmth, movement, sensation and capillary refill of the toes.","r":"hh"},{"id":177,"sec":"Clinical Cases & Scenarios","q":"Child with pneumonia – how to keep airway clear?","o":["Suction","Raise legs","Administer antibiotics only","Place in supine"],"a":0,"s":"","n":"","r":"hh"},{"id":178,"sec":"Clinical Cases & Scenarios","q":"Patient with DKA – first nursing intervention?","o":["IV Normal Saline","Give insulin first","Monitor glucose","Start potassium"],"a":0,"s":"","n":"","r":"hh"},{"id":179,"sec":"Clinical Cases & Scenarios","q":"Patient with cervical fracture – how to open airway?","o":["Head tilt","Chin lift","Jaw thrust","Suction only"],"a":2,"s":"","n":"","r":"hh"},{"id":180,"sec":"Clinical Cases & Scenarios","q":"Patient on continuous enteral feeding – what should nurse do?","o":["Warm formula","Elevate head of bed","Refrigerate formula","Flush tube only"],"a":1,"s":"c","n":"Corrected: formula should not be warmed or refrigerated for continuous feedin d Hygiene","q":"Which statement is correct about hand hygiene?","o":["Hand rubbing replaces hand washing completely","Hand washing is only for surgery","Both are part of hand hygiene","Only gloves are enough"],"a":2,"s":"","n":"","r":"hh"},{"id":269,"sec":"Infection Control & Hand Hygiene","q":"What is the first step in hand washing?","o":["Apply soap","Rinse hands","Wet hands with water","Dry hands"],"a":2,"s":"","n":"","r":"hh"},{"id":270,"sec":"Infection Control & Hand Hygiene","q":"Which of the following is NOT a goal of hand hygiene?","o":["Prevent infection","Kill microorganisms","Improve circulation","Reduce transmission"],"a":2,"s":"","n":"","r":"hh"},{"id":271,"sec":"Infection Control & Hand Hygiene","q":"What is the best method if hands are not visibly soiled?","o":["Hand washing only","Hand rubbing with alcohol-based solution","Wearing gloves","No action needed"],"a":1,"s":"","n":"","r":"hh"},{"id":272,"sec":"Infection Control & Hand Hygiene","q":"What is the primary purpose of Personal Protective Equipment (PPE)?","o":["Improve patient comfort","Protect healthcare workers and prevent infection transmission","Replace hand hygiene","Speed up procedures"],"a":1,"s":"","n":"","r":"hh"},{"id":273,"sec":"Infection Control & Hand Hygiene","q":"Which PPE should be used when there is a risk of splashing body fluids?","o":["Gloves only","Mask only","Gloves, gown, and face protection","Cap only"],"a":2,"s":"","n":"","r":"hh"},{"id":274,"sec":"Infection Control & Hand Hygiene","q":"Which finding indicates a break in infection control technique and requires staff education?","o":["Nurse aide not wearing gloves when feeding an elderly client","Nurse wears mask, gown, gloves for strict isolation","Nurse with open, weeping hand lesions wears gloves when providing care","TB patient wears a mask when leaving the room"],"a":2,"s":"","n":"","r":"hh"},{"id":275,"sec":"Infection Control & Hand Hygiene","q":"How long should a nurse perform hand washing with soap and water?","o":["10–20 seconds","20–30 seconds","40–60 seconds","2 minutes"],"a":2,"s":"","n":"","r":"hh"},{"id":276,"sec":"Infection Control & Hand Hygiene","q":"A patient with active TB should be placed in:","o":["Standard room","Negative pressure room","Positive pressure room","Semi-private room"],"a":1,"s":"","n":"","r":"hh"},{"id":277,"sec":"Infection Control & Hand Hygiene","q":"What is the main goal of aseptic technique?","o":["Kill all microorganisms","Reduce microorganism transmission","Protect nurse only","Speed up procedure"],"a":1,"s":"","n":"","r":"hh"},{"id":278,"sec":"Infection Control & Hand Hygiene","q":"Which patient requires airborne precautions?","o":["Patient with TB (PPD+, abnormal chest X-ray)","Patient with MRSA","Patient with Hepatitis B","Patient with UTI"],"a":0,"s":"","n":"","r":"hh"},{"id":279,"sec":"Infection Control & Hand Hygiene","q":"Which action by a nurse indicates a break in infection control and needs education?","o":["Giving feeding to elderly patient without gloves","Wearing gloves and mask for isolation","Hand hygiene before med admin","Disinfecting equipment"],"a":null,"s":"x","n":"All options describe acceptable practice; the question is incomplete. (The real break in technique is a nurse with weeping hand lesions giving direct care.)","r":"hh"},{"id":280,"sec":"Infection Control & Hand Hygiene","q":"What is the correct order for donning PPE?","o":["Gloves - Gown - Mask - Eye protection","Gown - Mask - Eye protection - Gloves","Mask - Gloves - Gown - Eye protection","Eye protection - Gloves - Gown - Mask"],"a":1,"s":"","n":"","r":"hh"},{"id":281,"sec":"Infection Control & Hand Hygiene","q":"What is the most important action to prevent infection in patients?","o":["Hand hygiene","Using gloves only","Wearing mask only","Cleaning equipment occasionally"],"a":0,"s":"","n":"","r":"hh"},{"id":282,"sec":"Infection Control & Hand Hygiene","q":"Which of the following findings indicates a break in technique and the need for education of staff for infection control procedures?","o":["The nurse aide is not wearing gloves when feeding an elderly client","The nurse puts on a mask, gown, and gloves before entering the room of a client on strict isolation","A nurse with open, weeping lesions on the hands puts on gloves before giving direct client care","A client with active tuberculosis is asked to wear a mask when leaving the room"],"a":2,"s":"c","n":"Corrected: a nurse with open, weeping hand lesions should not give direct care, so wearing gloves does not fix it. Not wearing gloves to feed a client is not a break in technique.","r":"hh"},{"id":283,"sec":"Infection Control & Hand Hygiene","q":"Which body fluid contains the highest concentration of HIV virus?","o":["Saliva","Blood","Urine","Sweat"],"a":1,"s":"","n":"","r":"hh"},{"id":284,"sec":"Infection Control & Hand Hygiene","q":"How many steps are there in proper handwashing technique?","o":["6","7","8","9"],"a":1,"s":"c","n":"The other handwashing questions in this bank use 7 steps; sources vary (WHO describes a longer sequence). Source key said 6.","r":"hh"},{"id":285,"sec":"Infection Control & Hand Hygiene","q":"Which of the following describes airborne isolation precautions?","o":["Patient wears a mask when leaving room","Patient is placed in a private room with negative pressure ventilation","No special precautions","Gloves and gown only"],"a":1,"s":"","n":"","r":"hh"},{"id":286,"sec":"Infection Control & Hand Hygiene","q":"What is the incubation period for hepatitis A?","o":["2–6 days","15–50 days","2–4 months","1 year"],"a":1,"s":"","n":"","r":"hh"},{"id":287,"sec":"Infection Control & Hand Hygiene","q":"A patient is diagnosed with Clostridioides difficile (C. diff). What type of isolation is required?","o":["Contact isolation","Droplet isolation","Airborne isolation","No isolation"],"a":0,"s":"","n":"","r":"hh"},{"id":288,"sec":"Infection Control & Hand Hygiene","q":"A patient has MRSA. How is it classified?","o":["Contact isolation","Droplet isolatio r developing infection?","o":["Influenza","Infection from family members","Urinary tract infection due to catheter use","Poor nutrition"],"a":2,"s":"","n":"","r":"hh"},{"id":311,"sec":"Infection Control & Hand Hygiene","q":"Isolation type for Meningitis:","o":["Contact","Airborne","Droplet","Protective"],"a":2,"s":"","n":"","r":"hh"},{"id":312,"sec":"Infection Control & Hand Hygiene","q":"Most important factor in handwashing:","o":["Friction","Time","Type of soap"],"a":0,"s":"","n":"","r":"hh"},{"id":313,"sec":"Infection Control & Hand Hygiene","q":"Most common nosocomial infection in hospitals:","o":["Pneumonia","Urinary tract infection (UTI)","Sepsis","Surgical site infection"],"a":1,"s":"","n":"","r":"hh"},{"id":314,"sec":"Infection Control & Hand Hygiene","q":"Steps in handwashing procedure:","o":["5","7","8","9"],"a":1,"s":"","n":"","r":"hh"},{"id":315,"sec":"Infection Control & Hand Hygiene","q":"Isolation type for Rubella:","o":["Contact","Airborne","Droplet","Standard"],"a":2,"s":"","n":"","r":"hh"},{"id":316,"sec":"Infection Control & Hand Hygiene","q":"Patient with fever and infection - nursing action:","o":["Give antibiotics","Follow infection control precautions","Wait and observe","Only notify physician"],"a":1,"s":"","n":"","r":"hh"},{"id":317,"sec":"Infection Control & Hand Hygiene","q":"Hospital-acquired infection example:","o":["Influenza","Community-acquired pneumonia","Urinary tract infection due to catheter use (UTI)","Malnutrition"],"a":2,"s":"","n":"","r":"hh"},{"id":318,"sec":"Infection Control & Hand Hygiene","q":"Hepatitis A incubation period:","o":["14 days","60 days","30 days","90 days"],"a":2,"s":"","n":"","r":"hh"},{"id":319,"sec":"Infection Control & Hand Hygiene","q":"Most significant blood-borne disease:","o":["HIV","Tuberculosis","Hepatitis","Influenza"],"a":2,"s":"","n":"","r":"hh"},{"id":320,"sec":"Infection Control & Hand Hygiene","q":"Correct order for PPE:","o":["Gloves - Gown - Mask - Goggles","Mask - Gloves - Gown - Goggles"," :"","n":"","r":"hh"},{"id":330,"sec":"CPR, AED & Emergency Response","q":"In a patient experiencing cardiac arrest, what is the priority action?","o":["Check blood pressure","Start chest compressions","Ensure airway and breathing","Insert IV line"],"a":1,"s":"c","n":"Corrected: current BLS (CAB) starts with chest compressions; the source marked airway/breathing.","r":"hh"},{"id":331,"sec":"CPR, AED & Emergency Response","q":"A patient is in cardiac arrest. What is the nurse’s priority action?","o":["Check blood glucose","Start IV fluids","Ensure airway and breathing","Take vital signs"],"a":2,"s":"","n":"","r":"hh"},{"id":332,"sec":"CPR, AED & Emergency Response","q":"What is the first action when a patient is found unresponsive with no pulse?","o":["Check temperature","Start CPR immediately","Give medication","Take blood sample"],"a":1,"s":"","n":"","r":"hh"},{"id":333,"sec":"CPR, AED & Emergency Response","q":"When you arrive at the scene of a victim, what should you do first?","o":["Begin CPR","Check the environment","Check pulse","Give oxygen"],"a":1,"s":"","n":"","r":"hh"},{"id":334,"sec":"CPR, AED & Emergency Response","q":"What is the correct compression to breath ratio for adult CPR?","o":["15:2","30:2","5:1","20:2"],"a":1,"s":"","n":"","r":"hh"},{"id":335,"sec":"CPR, AED & Emergency Response","q":"After checking a patient and confirming there is no pulse, what is the nurse’s first action?","o":["Start high-quality CPR 100/min","Start high-quality CPR 60/min","Start emergency response","Give epinephrine"],"a":2,"s":"","n":"","r":"hh"},{"id":336,"sec":"CPR, AED & Emergency Response","q":"You check a patient and find no pulse. What is the nurse’s first action?","o":["Start CPR at 60/min","Start CPR at 100/min","Activate emergency code","Give epinephrine"],"a":2,"s":"","n":"","r":"hh"},{"id":337,"sec":"CPR, AED & Emergency Response","q":"After checking that a patient has no pulse, what is the nurse’s first action?","o":["Activate emergency response","Start high-quality CPR 100/min","Start high-quality CPR 60/min","Call family"],"a":0,"s":"","n":"","r":"hh"},{"id":338,"sec":"CPR, AED & Emergency Response","q":"After performing 30 chest compressions on an adult, what is the next step?","o":["Give 2 rescue breaths","Continue chest compressions","Call for help","Check pulse"],"a":0,"s":"","n":"","r":"hh"},{"id":339,"sec":"CPR, AED & Emergency Response","q":"What is the compression-to-breath ratio for adult CPR with 2 rescue breaths?","o":["15:2","30:2","30:1","15:1"],"a":1,"s":"c","n":"Corrected: adult CPR ratio is 30:2 (15:2 is for children with two rescuers).","r":"hh"},{"id":340,"sec":"CPR, AED & Emergency Response","q":"What is an AED?","o":["Automatic external defibrillator","Airway emergency device","Automated entry device","Arterial evaluation device"],"a":0,"s":"","n":"","r":"hh"},{"id":341,"sec":"CPR, AED & Emergency Response","q":"After performing 30 chest compressions on an adult, what is next?","o":["1 rescue breath","2 rescue breaths","Continue compressions only","Call code"],"a":1,"s":"","n":"","r":"hh"},{"id":342,"sec":"CPR, AED & Emergency Response","q":"Why should suction be available during CPR?","o":["To clear airway and maintain open airway","To remove blood from IV","To measure secretions","Optional"],"a":0,"s":"","n":"","r":"hh"},{"id":343,"sec":"CPR, AED & Emergency Response","q":"When performing CPR on an adult, what is the recommended chest compression depth?","o":["1 inch","2 inches","3 inches","3/4 inch"],"a":1,"s":"","n":"","r":"hh"},{"id":344,"sec":"CPR, AED & Emergency Response","q":"During CPR, interruptions in chest compressions should be limited to less than:","o":["20 seconds","10 seconds","5 seconds","15 seconds"],"a":1,"s":"","n":"","r":"hh"},{"id":345,"sec":"CPR, AED & Emergency Response","q":"During CPR for an adult, how deep should chest compressions be?","o":["1–1.5 inches","2–2.4 inches","3–3.5 inches","4 inches"],"a":1,"s":"","n":"","r":"hh"},{"id":346,"sec":"CPR, AED & Emergency Response","q":"What is the correct compression to ventilation ratio in adult CPR?","o":["15:2","30:2","20:2","30:1"],"a":1,"s":"","n":"","r":"hh"},{"id":347,"sec":"CPR, AED & Emergency Response","q":"What does CAB stand for in Basic Life Support (BLS)?","o":["Circulation – Airway – Breathing","Circulation (30 compressions) - Airway - Breathing (2 breaths)","Airway – Breathing – Circulation","Breathing – Circulation – Airway"],"a":1,"s":"","n":"","r":"hh"},{"id":348,"sec":"CPR, AED & Emergency Response","q":"CPR chest compression depth for adults:","o":["1 inch","1.5 inches","2 inches","2.5 inches"],"a":2,"s":"","n":"","r":"hh"},{"id":349,"sec":"CPR, AED & Emergency Response","q":"AED helps determine:","o":["Asystole","VF","Sinus rhythm","Bradycardia"],"a":1,"s":"","n":"","r":"hh"},{"id":350,"sec":"CPR, AED & Emergency Response","q":"How to verify patient is breathing properly after CPR:","o":["No indicator","Patient walking","Observe chest rise","Check pulse only"],"a":2,"s":"","n":"","r":"hh"},{"id":351,"sec":"CPR, AED & Emergency Response","q":"After giving 30 chest compressions in CPR, what is the next action?","o":["Continue compressions","Give 2 rescue breaths","Check pulse","Administer oxygen"],"a":1,"s":"","n":"","r":"hh"},{"id":352,"sec":"CPR, AED & Emergency Response","q":"During CPR – minimize interruption to less than:","o":["20 sec","10 sec","5 sec","15 sec"],"a":1,"s":"","n":"","r":"hh"},{"id":353,"sec":"CPR, AED & Emergency Response","q":"AED – definition","o":["Automated External Defibrillator, used to analyze heart rhythm and deliver shock if needed","Device to measure oxygen","Manual blood pressure monitor","Heart rate monitor only"],"a":0,"s":"","n":"","r":"hh"},{"id":354,"sec":"Assessment, Vital Signs & Diagnostics","q":"What is the correct sign for ineffective tissue perfusion?","o":["Warm skin","Strong pulse","Absent pedal and tibial pulse","Normal capillary refill"],"a":2,"s":"","n":"","r":"hh"},{"id":355,"sec":"Assessment, Vital Signs & Diagnostic  for an immobilized patient:","o":["Vitals","Skin integrity","Range of Motion (ROM)","Pain"],"a":2,"s":"d","n":"Doubtful: skin integrity and neurovascular status are usually higher priority for an immobilized patient.","r":"hh"},{"id":541,"sec":"Nursing Process, Ethics & Management","q":"Pain assessment / intervention - which action is priority?","o":["Administer narcotic immediately","Wait for patient to ask","Call physician","Use appropriate pain scale, then administer analgesia as prescribed"],"a":3,"s":"","n":"","r":"hh"},{"id":542,"sec":"Nursing Process, Ethics & Management","q":"Primary role of the nurse (example question about pain and discomfort):","o":["Only administer meds","Document findings","Promote comfort and relieve pain","Assist physician only"],"a":2,"s":"","n":"","r":"hh"},{"id":543,"sec":"Nursing Process, Ethics & Management","q":"Which statement indicates evidence-based practice?","o":["Use intuition to guide care","Follow only hospital policy","Use previous evidence to implement current care","Implement new ideas without review"],"a":2,"s":"","n":"","r":"hh"},{"id":544,"sec":"Nursing Process, Ethics & Management","q":"Most important reason for documentation:","o":["Prevent conflict","Comfort","Communication & promote care","Legal only"],"a":2,"s":"","n":"","r":"hh"},{"id":545,"sec":"Nursing Process, Ethics & Management","q":"Evidence-based practice definition:","o":["Use intuition to guide care","Follow only hospital policy","Integrate clinical expertise with patient preferences and previous evidence","Implement new ideas without review"],"a":2,"s":"","n":"","r":"hh"},{"id":546,"sec":"Nursing Process, Ethics & Management","q":"Nursing process steps (correct order):","o":["Diagnosis - Assessment - Planning - Intervention - Evaluation","Assessment - Planning - Diagnosis - Intervention - Evaluation","Assessment - Diagnosis - Planning - Intervention - Evaluation","Planning - Assessment - Intervention - Evaluation - Diagnosis"],"a":2,"s":"","n":""," ead trauma may cause:","o":["Hypertension","Increased intracranial pressure","Hypotension","Bradycardia"],"a":1,"s":"","n":"","r":"hh"},{"id":556,"sec":"General Medical-Surgical Knowledge","q":"What is the main purpose of triage in nursing?","o":["Save time","Identify urgent vs non-urgent cases","Reduce paperwork","Prevent infection"],"a":1,"s":"","n":"","r":"hh"},{"id":557,"sec":"General Medical-Surgical Knowledge","q":"Measles primarily affects which age group?","o":["Newborns","Children under 5 years","Adults","Elderly"],"a":1,"s":"","n":"","r":"hh"},{"id":558,"sec":"General Medical-Surgical Knowledge","q":"As a nurse, which clinical manifestations would you expect in a patient with Cushing’s syndrome?","o":["Hypotension and weight loss","Hypertension, moon face, buffalo hump","Bradycardia and hypoglycemia","Cyanosis and edema"],"a":1,"s":"","n":"","r":"hh"},{"id":559,"sec":"General Medical-Surgical Knowledge","q":"After a sigmoidoscopy, what should the nurse monitor for?","o":["Hemorrhage","Headache","Fever","Chest pain"],"a":0,"s":"","n":"","r":"hh"},{"id":560,"sec":"General Medical-Surgical Knowledge","q":"When performing care for a child with a rectal laceration, what should the nurse check with the parents?","o":["Child’s allergy history","Child’s tetanus vaccination status","Child’s diet","Child’s school attendance"],"a":1,"s":"","n":"","r":"hh"},{"id":561,"sec":"General Medical-Surgical Knowledge","q":"How do you open the airway in a patient with a suspected neck fracture?","o":["Head tilt-chin lift","Jaw-thrust maneuver","Hyperextend neck","Give oxygen only"],"a":1,"s":"","n":"","r":"hh"},{"id":562,"sec":"General Medical-Surgical Knowledge","q":"What is the normal resting heart rate for an adult?","o":["60–80 bpm","120–100 bpm","120–140 bpm","40–60 bpm"],"a":0,"s":"","n":"","r":"hh"},{"id":563,"sec":"General Medical-Surgical Knowledge","q":"Which vitamin is important for good vision?","o":["B12","B6","C","A"],"a":3,"s":"","n":"","r":"hh"},{"id":564,"sec": ","n":"","r":"hh"},{"id":571,"sec":"General Medical-Surgical Knowledge","q":"Which of the following is an example of a modifiable risk factor for cardiovascular disease?","o":["Age","Gender","Family history","Smoking"],"a":3,"s":"","n":"","r":"hh"},{"id":572,"sec":"General Medical-Surgical Knowledge","q":"Which type of IV fluid is appropriate for cerebral edema?","o":["Hypotonic","Isotonic","Hypertonic","None"],"a":2,"s":"","n":"","r":"hh"},{"id":573,"sec":"General Medical-Surgical Knowledge","q":"First action when arriving at a victim?","o":["Check breathing","Tap shoulder","Make sure scene is safe","Attach AED"],"a":2,"s":"","n":"","r":"hh"},{"id":574,"sec":"General Medical-Surgical Knowledge","q":"Which finding is the most specific indicator for the onset of acute pulmonary edema?","o":["Pink, frothy sputum","Peripheral edema","Elevated CVP","Pulmonary crackles"],"a":0,"s":"","n":"","r":"hh"},{"id":575,"sec":"General Medical-Surgical Knowledge","q":"What is the primary reason for shaving and washing the surgical site?","o":["Improve visualization of landmarks","Assist in accurate pre-op assessment","Reduce bacteria at surgical site","Enhance tape adhesion"],"a":2,"s":"","n":"","r":"hh"},{"id":576,"sec":"General Medical-Surgical Knowledge","q":"Which action requires immediate intervention by the nurse when a triage nurse places a disaster tag on a client?","o":["Treat the client’s clinical manifestations, do not treat the monitor","Provide accurate documentation","Document the tag number","Provider removes the tag"],"a":0,"s":"d","n":"Garbled question; the underlying principle is to treat the patient, not the monitor.","r":"hh"},{"id":577,"sec":"General Medical-Surgical Knowledge","q":"Which of the following statements regarding COPD is true?","o":["Patient with COPD may have chronic hypoxia","Peak expiration flow (PEFR) is the assessment of choice","COPD is mainly caused by environmental pollution","Patients should only be treated if previously diagnosed"],"a":0,"s":"","n":"","r":"hh"},{"id":578,"sec":"General Medical-Surgical Knowledge","q":"Which finding is most specific for acute pulmonary edema?","o":["Elevated central venous pressure","Pulmonary crackles","Pink frothy sputum","Peripheral edema"],"a":2,"s":"","n":"","r":"hh"},{"id":579,"sec":"General Medical-Surgical Knowledge","q":"Best post-op action after total hip replacement?","o":["Apply traction to affected limb","Maintain hip abduction","Keep head of bed elevated at 45°","Encourage sitting cross-legged"],"a":1,"s":"","n":"","r":"hh"},{"id":580,"sec":"General Medical-Surgical Knowledge","q":"Most consistent with acute stage pulmonary edema?","o":["Crackles","Sputum production","Elevated CVP","Peripheral edema"],"a":0,"s":"","n":"","r":"hh"},{"id":581,"sec":"General Medical-Surgical Knowledge","q":"Which of the following is a primary responsibility of the nurse?","o":["Prescribing medications","Performing surgeries","Diagnosing medical conditions","Providing direct patient care"],"a":3,"s":"","n":"","r":"hh"},{"id":582,"sec":"General Medical-Surgical Knowledge","q":"Which of the following structures is the primary pacemaker of the heart?","o":["Atrioventricular (AV) node","Purkinje fibers","Ventricular tissue","Sinoatrial (SA) node"],"a":3,"s":"","n":"","r":"hh"},{"id":583,"sec":"General Medical-Surgical Knowledge","q":"Which of the following symptoms is most commonly associated with left-sided heart failure?","o":["Hepatic engorgement","Hypotension","Crackles","Arrhythmia"],"a":2,"s":"","n":"","r":"hh"},{"id":584,"sec":"General Medical-Surgical Knowledge","q":"Which patient scenario requires the nurse to intervene most quickly?","o":["Patient with mild headache","Patient with chest pain and a history of angina","Patient with mild nausea","Patient scheduled for routine lab tests"],"a":1,"s":"","n":"","r":"hh"},{"id":585,"sec":"General Medical-Surgical Knowledge","q":"How should you provide nutrition to a patient with aspiration risk and loss of consciousness?","o":["Orally in the usual way","Orally with upright positioning","Via PEG or NG tube","Through air suction"],"a":2,"s":"","n":"","r":"hh"},{"id":586,"sec":"General Medical-Surgical Knowledge","q":"What is the initial action for a child with a first-degree burn?","o":["Apply ice directly on the burn","Remove burned clothing and cool with lukewarm water for 10–15 minutes","Apply thick ointment","Cover burn with dry gauze"],"a":1,"s":"","n":"","r":"hh"},{"id":587,"sec":"General Medical-Surgical Knowledge","q":"A nurse caring for patients from different cultures should:","o":["Teach them your culture","Ignore cultural practices","Respect the cultures, values, and beliefs of others","Treat everyone the same regardless of background"],"a":2,"s":"","n":"","r":"hh"},{"id":588,"sec":"General Medical-Surgical Knowledge","q":"Which precautions are required for meningitis (bacterial)?","o":["Airborne","Droplet precautions","Contact only","Standard only"],"a":1,"s":"","n":"","r":"hh"},{"id":589,"sec":"General Medical-Surgical Knowledge","q":"What is the first action when a client bleeds from the amputation stump?","o":["Notify the physician","Apply ice pack","Place a tourniquet","Apply pressure dressing to the stump"],"a":3,"s":"","n":"","r":"hh"},{"id":590,"sec":"General Medical-Surgical Knowledge","q":"A trauma patient with suspected neck injury, stridor, and SpO2 88% is given a non-rebreather mask. What is the next step?","o":["Move neck freely","Apply cervical traction","Give oxygen and X-ray","Maintain airway with cervical spine immobilization"],"a":3,"s":"","n":"","r":"hh"},{"id":591,"sec":"General Medical-Surgical Knowledge","q":"What is the main focus of nursing practice?","o":["Diagnosing disease","Prescribing medication","Surgery","Ethical care & patient-centered care"],"a":3,"s":"","n":"","r":"hh"},{"id":592,"sec":"General Medical-Surgical Knowledge","q":"Which of the following is objective data?","o":["Chest pain","Dizziness","Complaint","Blood pressure reading"],"a":3,"s":"","n":"","r":"hh"},{"id":593,"sec":"General Medical-Surgical Knowledge","q":"Which is a core nursing value?","o":["Speed","Knowledge","Skill","Compassion"],"a":3,"s":"","n":"","r":"hh"},{"id":594,"sec":"General Medical-Surgical Knowledge","q":"What is triage?","o":["Treat all patients","Discharge","Prioritize based on severity","Diagnose"],"a":2,"s":"","n":"","r":"hh"},{"id":595,"sec":"General Medical-Surgical Knowledge","q":"Purpose of triage nurse checking tags:","o":["Call healthcare provider","Licensed nurse secures tag","Unlicensed nurse checks vitals","Document triage"],"a":3,"s":"d","n":"Garbled question; unclear what is being asked.","r":"hh"},{"id":596,"sec":"General Medical-Surgical Knowledge","q":"Absence of breathing is called:","o":["Dyspnea","Apnea","Tachypnea","Bradypnea"],"a":1,"s":"","n":"","r":"hh"},{"id":597,"sec":"General Medical-Surgical Knowledge","q":"A pre-operative patient scheduled for hip replacement uses an external pneumatic compression device to help with:","o":["Decrease breath sounds","Bleeding at surgical site","Deep vein thrombosis (DVT) prevention","Pain relief"],"a":2,"s":"","n":"","r":"hh"},{"id":598,"sec":"General Medical-Surgical Knowledge","q":"During a code, the nurse should:","o":["Only perform chest compressions","Only give rescue breaths","Document later","Listen carefully to directions and perform actions accordingly"],"a":3,"s":"","n":"","r":"hh"},{"id":599,"sec":"General Medical-Surgical Knowledge","q":"Which action requires immediate intervention by the nurse when a triage nurse places a disaster tag on a client?","o":["Monitor vital signs later","Wait for physician orders","Treat the client’s clinical manifestations, do not treat the monitor","Document first"],"a":2,"s":"d","n":"Garbled question; the underlying principle is to treat the patient, not the monitor.","r":"hh"},{"id":600,"sec":"General Medical-Surgical Knowledge","q":"After sigmoidoscopy, the nurse should observe for:","o":["Hemorrhage and Nausea","He "},{"id":640,"sec":"Clinical Cases & Scenarios","q":"Which fetal heart rate pattern indicates the highest risk to the fetus?","o":["Early decelerations","Variable decelerations","Late decelerations","Accelerations"],"a":2,"s":"","n":"Late decelerations indicate uteroplacental insufficiency.","r":"east"},{"id":641,"sec":"Medications","q":"A patient is receiving heparin therapy. What is the most significant risk associated with this medication?","o":["Hypertension and fluid retention","Bleeding, including internal bleeding and bruising","Hyperglycemia and weight gain","Hair loss and dry skin"],"a":1,"s":"","n":"","r":"east"},{"id":642,"sec":"Medications","q":"A patient is receiving furosemide for heart failure. Which of the following should the nurse monitor closely due to the potential side effect of this medication?","o":["Calcium levels","Potassium levels","Sodium levels","Phosphate levels"],"a":1,"s":"","n":"","r":"east"},{"id":643,"sec":"ECG & Cardiac Rhythms","q":"A patient presents with chest pain and shortness of breath, and the ECG shows ST-segment elevation. What is the nurse’s priority intervention?","o":["Administer intravenous fluids to rehydrate the patient","Monitor vital signs and assess for signs of heart failure","Prepare for immediate cardiology consultation and administer oxygen to the patient","Encourage the patient to take deep breaths and remain calm"],"a":2,"s":"","n":"The source wording was garbled (“S-sigmoid wave”); read here as ST-segment elevation.","r":"east"},{"id":644,"sec":"Nursing Procedures & Skills","q":"What is the most serious alarm on a mechanical ventilator (MV) that indicates a critical condition?","o":["High pressure alarm","Low pressure alarm","Apnea alarm","High tidal volume alarm"],"a":0,"s":"d","n":"Doubtful: many references treat low-pressure (disconnection/leak) and apnea alarms as the most critical; high-pressure alarms are common (secretions, kinking). Source key: high pressure.","r":"east"},{"id":645,"sec":"Clinical Cases & Scenarios","q":"A patient on mechanical ventilation develops a sudden increase in airway pressure and shows signs of increased work of breathing. What is the nurse’s priority intervention?","o":["Increase the ventilator’s tidal volume setting","Check the patient’s endotracheal tube for dislodgement or obstruction","Administer bronchodilators as ordered","Sedate the patient to reduce anxiety and the work of breathing"],"a":1,"s":"","n":"","r":"east"},{"id":646,"sec":"Clinical Cases & Scenarios","q":"Patient with depression expresses feelings of hopelessness and has mentioned thoughts of harming themselves. As a nurse, what should be your priority intervention?","o":["Ensure that the environment is safe and remove any harmful objects","Encourage the patient to ignore their negative thoughts and focus on positive activities","Reassure the patient that they will get better without further intervention","Avoid discussing their feelings and allow them to process on their own"],"a":0,"s":"","n":"","r":"east"},{"id":647,"sec":"Assessment, Vital Signs & Diagnostics","q":"A 2-year-old child presents with severe diarrhea. What are the signs of severe dehydration that the nurse should observe for in this child?","o":["The child has moist skin, is active, and urinates normally","The child has sunken eyes, dry mouth, and decreased urine output","The child is playing actively, has no signs of fatigue, and is drinking fluids well","The child has glowing skin and shows no signs of dehydration"],"a":1,"s":"","n":"","r":"east"},{"id":648,"sec":"Clinical Cases & Scenarios","q":"A pregnant woman presents with blurred vision. What is the most important nursing intervention to prioritize?","o":["Monitor the woman’s blood pressure regularly and notify the healthcare provider if it is elevated","Encourage the woman to rest and avoid any physical activity","Advise the woman to drink more fluids to improve vision","Recommend that the woman take a nap to alleviate the blurred vision"],"a":0,"s":"","n":"","r":"east"},{"id":649,"sec":"Clinical Cases & Scenarios","q":"A 60-year-old male with chronic kidney disease reports difficulty breathing when lying down and is frequently awake at night due to shortness of breath. What nursing intervention is most appropriate?","o":["Administer oxygen therapy immediately","Instruct the patient to sleep with his head elevated to relieve symptoms","Provide a sedative to help the patient sleep","Encourage the patient to exercise to improve lung function"],"a":1,"s":"","n":"","r":"east"},{"id":650,"sec":"Infection Control & Hand Hygiene","q":"A patient with chronic kidney disease (CKD) is being discharged. Which of the following actions is the most important for the patient to take to prevent infections?","o":["Avoid crowded places","Wash hands frequently","Wear gloves when touching objects","Drink a lot of fluids"],"a":1,"s":"","n":"","r":"east"},{"id":651,"sec":"Clinical Cases & Scenarios","q":"A patient with septic shock presents with hypotension, tachycardia, and confusion. What is the priority nursing intervention?","o":["Administer IV fluids to improve circulation","Provide oxygen therapy to improve oxygenation","Administer antibiotics as ordered","Monitor blood pressure every 15 minutes"],"a":0,"s":"","n":"","r":"east"},{"id":652,"sec":"Clinical Cases & Scenarios","q":"A patient with asthma is experiencing shortness of breath and wheezing. What is the nurse’s priority intervention?","o":["Administer the prescribed short-acting beta-agonist (SABA) inhaler","Encourage the patient to drink fluids to clear the airways","Provide the patient with a sedative to reduce anxiety","Ask the patient to sit up straight and relax"],"a":0,"s":"","n":"","r":"east"},{"id":653,"sec":"ECG & Cardiac Rhythms","q":"A patient presents with severe chest pain, shortness of breath, and diaphoresis. The ECG shows ST-segment elevation. What is the nurse’s priority action?","o":["Administer aspirin and oxygen as ordered","Prepare the patient for a chest X-ray","Monitor the patient’s vital signs and document the symptoms","Encourage the patient to walk to assess their tolerance"],"a":0,"s":"","n":"","r":"east"},{"id":654,"sec":"Medications","q":"Which vaccine is contraindicated in an immunocompromised child?","o":["Inactivated polio vaccine (IPV)","Hepatitis B vaccine","Measles, Mumps, and Rubella (MMR) vaccine","Influenza vaccine (inactivated)"],"a":2,"s":"","n":"","r":"east"},{"id":655,"sec":"Assessment, Vital Signs & Diagnostics","q":"Which of the following fetal heart rate (FHR) patterns is considered the most serious and requires immediate intervention?","o":["Acceleration","Moderate variability","Variable decelerations","Early decelerations"],"a":2,"s":"","n":"Late or prolonged decelerations are the most worrisome; among these options only variable decelerations are abnormal.","r":"east"},{"id":656,"sec":"IV Fluids, Electrolytes & Acid-Base","q":"Which of the following conditions is most likely to cause metabolic acidosis?","o":["Vomiting","Diabetic Ketoacidosis (DKA)","Excessive antacid use","Nasogastric suctioning"],"a":1,"s":"","n":"","r":"east"},{"id":657,"sec":"IV Fluids, Electrolytes & Acid-Base","q":"A patient’s arterial blood gas (ABG) results are: pH = 7.50 PaCO₂ = 45 mmHg HCO₃⁻ = 32 mEq/L Which condition is most likely causing these results?","o":["Diabetic ketoacidosis (DKA)","Vomiting","Acute respiratory failure","Sepsis"],"a":1,"s":"","n":"","r":"east"},{"id":658,"sec":"CPR, AED & Emergency Response","q":"A patient presents to the emergency room with severe burns. What is the nurse’s priority intervention?","o":["Apply ice directly to the burned area","Cover the burn with a clean, dry cloth","Break any blisters that have formed","Apply ointment immediately to the burn"],"a":1,"s":"","n":"","r":"east"},{"id":659,"sec":"IV Fluids, Electrolytes & Acid-Base","q":"A patient is experiencing severe fluid volume deficit (dehydration). What is the nurse’s priority action?","o":["Encourage oral fluid intake slowly","Start IV fluid replacement as prescribed","Restrict fluid intake","Monitor the patient’s daily weight once a week"],"a":1,"s":"","n":"","r":"east"},{"id":660,"sec":"General Medical-Surgical Knowledge","q":"A patient has completed a course of radiation therapy. What is the nurse’s priority teaching?","o":["Apply heating pads to the radiated area to relieve discomfort","Expose the radiated skin to direct sunlight for faster healing","Keep the radiated area clean and dry, and avoid harsh soaps","Scrub the radiated area vigorously to prevent infection"],"a":2,"s":"","n":"","r":"east"},{"id":661,"sec":"Infection Control & Hand Hygiene","q":"Which action by the nurse helps prevent infection in a patient with neutropenia?","o":["Frequent handwashing before and after patient contact","Encouraging the patient to visit crowded places with a mask","Allowing fresh flowers in the patient’s room","Giving live vaccines during treatment"],"a":0,"s":"","n":"","r":"east"},{"id":662,"sec":"General Medical-Surgical Knowledge","q":"A patient is receiving chemotherapy. What common side effect should the nurse monitor for?","o":["Hair loss (alopecia)","Hypertension","Increased appetite","Hyperactivity"],"a":0,"s":"","n":"","r":"east"},{"id":663,"sec":"Clinical Cases & Scenarios","q":"What is the priority nursing action when a patient with diabetes is found unconscious and diaphoretic?","o":["Provide oral glucose","Call the physician","Start an IV line","Administer glucagon"],"a":3,"s":"c","n":"An unconscious patient cannot swallow, so oral glucose risks aspiration. Give glucagon IM/SC, or IV dextrose if IV access exists. (Source key said oral glucose.)","r":"east"},{"id":664,"sec":"Clinical Cases & Scenarios","q":"A postoperative patient reports sudden shortness of breath and chest pain. What should the nurse suspect?","o":["Pulmonary embolism","Myocardial infarction","Pneumonia","Pleural effusion"],"a":0,"s":"","n":"","r":"east"},{"id":665,"sec":"Assessment, Vital Signs & Diagnostics","q":"Which of the following is the earliest sign of shock?","o":["Decreased blood pressure","Tachycardia","Cyanosis","Cold extremities"],"a":1,"s":"c","n":"Tachycardia is the earliest sign of shock (compensation); falling BP is a late sign. (Source key said decreased BP.)","r":"east"},{"id":666,"sec":"CPR, AED & Emergency Response","q":"What is the primary nursing intervention during a code blue event?","o":["Record the time of collapse","Administer iv fluids","Begin chest compressions","Check blood sugar"],"a":2,"s":"","n":"","r":"east"},{"id":667,"sec":"Clinical Cases & Scenarios","q":"A patient receiving chemotherapy develops a fever. What is the nurse’s priority action?","o":["Administer acetaminophen","Notify the physician immediately","Increase fluid intake","Document the finding"],"a":1,"s":"","n":"","r":"east"},{"id":668,"sec":"Infection Control & Hand Hygiene","q":"Which intervention best reduce the risk of infection in neutropenic patients?","o":["Using the N95 mask","Performing hand hygiene","Wearing sterile gloves","Giving antibiotics prophylactically"],"a":1,"s":"","n":"","r":"east"},{"id":669,"sec":"Medications","q":"Which of the following lab values should the nurse monitor for a patient on warfarin?","o":["INR","Potassium","Hemoglobin A1c","CREATININE"],"a":0,"s":"","n":"","r":"east"},{"id":670,"sec":"Clinical Cases & Scenarios","q":"A Patient reports chest pain unrelieved by nitroglycerine. What should the nurse do first?","o":["Start CPR","Notify the physician","Administer morphine as prescribed","Encourage deep breathing"],"a":1,"s":"","n":"","r":"east"},{"id":671,"sec":"Clinical Cases & Scenarios","q":"What behavior is most concerning in a patient with depression?","o":["Crying","Withdrawal from activity","Giving away personal items","Insomnia"],"a":2,"s":"","n":"","r":"east"},{"id":672,"sec":"Clinical Cases & Scenarios","q":"A schizophrenia patient believes the nurse is part of a conspiracy. What is the best nursing response?","o":["Argue with the patient","Ask for clarification","Acknowledge the patients’ feelings without reinforcing the delusion","Avoid the patient"],"a":2,"s":"","n":"","r":"east"},{"id":673,"sec":"Assessment, Vital Signs & Diagnostics","q":"What is the most appropriate pain scale for 3-year-old child?","o":["Numerical rating scale","FLACC scale","Wong-Baker FACES scale","Visual analog scale"],"a":2,"s":"","n":"","r":"east"},{"id":674,"sec":"Nursing Process, Ethics & Management","q":"A nurse is teaching parents about fever management in children. Which statement indicates understanding?","o":["Use aspirin for high fever","Bathe in cold water","Use acetaminophen as directed","Keep the child covered tightly"],"a":2,"s":"","n":"","r":"east"},{"id":675,"sec":"Clinical Cases & Scenarios","q":"A woman in labor is experiencing late deceleration. What is the nurse’s initial intervention?","o":["Turn the patient to her left side","Increase Iv fluids","Administer oxygen","Notify the physician"],"a":0,"s":"","n":"","r":"east"},{"id":676,"sec":"Assessment, Vital Signs & Diagnostics","q":"Which assessment finding is most concerning in a postpartum patient?","o":["Fundus firm and midline","Lochia rubra","Saturating a pad in 15 minutes","Mild uterine cramping"],"a":2,"s":"","n":"","r":"east"},{"id":677,"sec":"Nursing Procedures & Skills","q":"What is the most important nursing action during a routine vaccination visit?","o":["Assess for contraindications","Perform a complete physical exam","Draw blood for labs","Ask about diet"],"a":0,"s":"","n":"","r":"east"},{"id":678,"sec":"General Medical-Surgical Knowledge","q":"A Patient undergoing radiation therapy has skin breakdown at the treatment site.What should the nurse advise?","o":["Apply lotion immediately before treatment","Keep the area clean and dry","Expose the area to sunlight","Use heating pads for comfort"],"a":1,"s":"","n":"","r":"east"},{"id":679,"sec":"Clinical Cases & Scenarios","q":"Patient with heart failure reports shortness of breath while lying flat. What is the best nursing intervention?","o":["Encourage ambulation","Elevate the head of the bed","Restrict fluid intake","Provide oxygen only if saturation is below 85%"],"a":1,"s":"","n":"","r":"east"},{"id":680,"sec":"Nursing Procedures & Skills","q":"A Nurse is monitoring a patient on mechanical ventilation. Which alarm requires immediate intervention?","o":["Low tidal volume alarm","High respiratory rate alarm","Low battery alarm","Apnea alarm"],"a":1,"s":"d","n":"Doubtful: an apnea alarm usually signals the most critical problem (no spontaneous breaths). Source key: high respiratory rate.","r":"east"},{"id":681,"sec":"Clinical Cases & Scenarios","q":"A patient with schizophrenia reports hearing voices commanding them to harm others. What is the nurse’s priority intervention?","o":["Encourage the patient to ignore the voices","Assess for risk of harm and ensure safety","Discuss the content of the hallucinations later","Tell the patient the voices aren’t real"],"a":1,"s":"","n":"","r":"east"},{"id":682,"sec":"Infection Control & Hand Hygiene","q":"A nurse is caring for a patient with neutropenia. Which nursing action is most important?","o":["Encouraging visitors to bring flowers","Monitoring signs of infection","Administering live vaccines","Encouraging raw vegetable intake"],"a":1,"s":"","n":"","r":"east"},{"id":683,"sec":"ECG & Cardiac Rhythms","q":"A patient is experiencing chest pain and has ST-segment elevation on ECG. What is the nurse’s priority action?","o":["Obtain a complete blood count","Administer prescribed nitroglycerin","Encourage deep breathing exercises","Delay treatment until troponin level return"],"a":1,"s":"","n":"Aspirin is the first drug for suspected MI; nitroglycerin is the best of these options. Use caution in inferior MI or hypotension.","r":"east"},{"id":684,"sec":"General Medical-Surgical Knowledge","q":"What is priority nursing intervention for a patient receiving radiation therapy?","o":["Encouraging sun exposure","Applying lotion to the treatment area before therapy","Monitor for skin integrity changes","Restricting fluid intake"],"a":2,"s":"","n":"","r":"east"}];
const L="ABCDE",SECS=[...new Set(D.map(x=>x.sec))],app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let sec="All",st={};
let star=new Set();try{star=new Set(JSON.parse(localStorage.getItem("star")||"[]"))}catch(e){}
const saveStar=()=>{try{localStorage.setItem("star",JSON.stringify([...star]))}catch(e){}};
const pool=(f)=>D.filter(x=>(sec==="All"||x.sec===sec)&&(!f||f(x)));
const tags=x=>`<span class="tag">${esc(x.sec)}</span>`+(x.s==="c"?'<span class="tag c">Corrected</span>':x.s==="d"?'<span class="tag d">Doubtful</span>':x.s==="x"?'<span class="tag x">No valid option</span>':"");
const pic=x=>x.img?`<img class="ecg" alt="ECG strip" src="${x.img}">`:"";
const isA=(x,i)=>Array.isArray(x.a)?x.a.includes(i):x.a===i;
const ansTxt=x=>x.a===null?"No listed option is correct":(Array.isArray(x.a)?x.a:[x.a]).map(i=>L[i]+") "+x.o[i]).join("  +  ");
const nav=(a,b)=>`<div class="top"><button class="lk" onclick="home()">← Home</button><span class="mut">${b}</span></div>`;
function home(){
 const qz=pool(x=>x.o.length>1&&x.s!=="x").length;
 app.innerHTML=`<h1>🩺 Nursing Question Bank</h1><div class="mut">${D.length} questions · from 3 sources, answers reviewed and flagged where the source key looked wrong</div>
 <div class="card"><label class="mut">Section</label><select onchange="sec=this.value;home()">${["All",...SECS].map(s=>`<option ${s===sec?"selected":""}>${esc(s)}</option>`).join("")}</select>
 <button class="btn p" onclick="cards(pool())">Flashcards (${pool().length})</button>
 <button class="btn p" onclick="quizSetup()">Quiz (${qz} available)</button>
 <button class="btn" onclick="search()">Search</button>
 <button class="btn" onclick="cards(pool(x=>x.s))">Review flagged answers (${pool(x=>x.s).length})</button>
 <button class="btn" onclick="cards(pool(x=>star.has(x.id)))">Starred cards (${pool(x=>star.has(x.id)).length})</button></div>
 <div class="card mut"><span class="tag c">Corrected</span> answer changed after review · <span class="tag d">Doubtful</span> question unclear or debatable · <span class="tag x">No valid option</span> excluded from quiz.<br><br>Reviewed by AI against standard nursing references. Always confirm with your official exam material.</div>`;}
function cards(list,i=0,flip=false){
 st={list:shuf(list),i,flip};if(!st.list.length){alert("Nothing here yet.");return}
 st.list=list.slice();drawCard()}
function drawCard(){const{list,i,flip}=st,x=list[i];
 app.innerHTML=nav("",`${i+1} / ${list.length}`)+`<div class="bar"><i style="width:${(i+1)/list.length*100}%"></i></div>
 <div class="card" onclick="st.flip=!st.flip;drawCard()" style="cursor:pointer;min-height:220px">${tags(x)}<div class="q">${esc(x.q)}</div>${pic(x)}
 ${flip?`<div class="ans">${esc(ansTxt(x))}</div>${x.o.length>1?'<div class="mut" style="margin-top:8px">'+x.o.map((o,k)=>L[k]+") "+esc(o)).join("<br>")+"</div>":""}${x.n?`<div class="note">${esc(x.n)}</div>`:""}`:'<div class="mut">Tap to reveal the answer</div>'}</div>
 <div class="row"><button class="btn" onclick="st.i=Math.max(0,st.i-1);st.flip=false;drawCard()">Prev</button>
 <button class="btn" onclick="toggleStar(${x.id})">${star.has(x.id)?"★ Starred":"☆ Star"}</button>
 <button class="btn p" onclick="st.i=Math.min(st.list.length-1,st.i+1);st.flip=false;drawCard()">Next</button></div>
 <button class="lk" onclick="st.list=shuf(st.list);st.i=0;st.flip=false;drawCard()">Shuffle</button>`}
function toggleStar(id){star.has(id)?star.delete(id):star.add(id);saveStar();drawCard()}
function quizSetup(){const n=pool(x=>x.o.length>1&&x.s!=="x").length;
 app.innerHTML=nav("","Quiz")+`<div class="card"><div class="q">How many questions?</div>${[10,20,50,n].map(k=>`<button class="btn" onclick="quiz(${Math.min(k,n)})">${k===n?"All ("+n+")":k}</button>`).join("")}</div>`}
function quiz(n){const l=shuf(pool(x=>x.o.length>1&&x.s!=="x")).slice(0,n);
 st={l,i:0,score:0,miss:[]};qDraw()}
function qDraw(){const x=st.l[st.i];if(!x)return fin();
 st.perm=shuf(x.o.map((_,k)=>k));st.sel=new Set();st.done=false;st.multi=Array.isArray(x.a);qRender()}
function qRender(){const x=st.l[st.i];
 app.innerHTML=nav("",`${st.i+1} / ${st.l.length} · Score ${st.score}`)+`<div class="bar"><i style="width:${st.i/st.l.length*100}%"></i></div>
 <div class="card">${tags(x)}<div class="q">${esc(x.q)}</div>${pic(x)}${st.multi?'<div class="mut">Select all that apply</div>':""}
 ${st.perm.map((k,p)=>{let c="btn opt";if(st.done){if(isA(x,k))c+=" ok";else if(st.sel.has(k))c+=" no"}else if(st.sel.has(k))c+=" sel";
 return `<button class="${c}" onclick="pick(${k})">${esc(x.o[k])}</button>`}).join("")}
 ${st.multi&&!st.done?'<button class="btn p" onclick="check()">Check</button>':""}
 ${st.done?(x.n?`<div class="note">${esc(x.n)}</div>`:"")+'<button class="btn p" onclick="st.i++;qDraw()">Next</button>':""}</div>`}
function pick(k){if(st.done)return;const x=st.l[st.i];
 if(st.multi){st.sel.has(k)?st.sel.delete(k):st.sel.add(k);qRender();return}
 st.sel=new Set([k]);check()}
function check(){const x=st.l[st.i];st.done=true;
 const ok=st.multi?(x.a.length===st.sel.size&&x.a.every(a=>st.sel.has(a))):st.sel.has(x.a);
 if(ok)st.score++;else st.miss.push(x);qRender()}
function fin(){const t=st.l.length;
 app.innerHTML=nav("","Done")+`<div class="card"><h1>${st.score} / ${t}</h1><div class="mut">${Math.round(st.score/t*100)}% correct</div>
 <button class="btn p" onclick="quizSetup()">New quiz</button>${st.miss.length?`<button class="btn" onclick="cards(st.miss)">Review missed (${st.miss.length})</button>`:""}</div>`}
function search(){app.innerHTML=nav("","Search")+`<input id="s" placeholder="Search questions or answers…" oninput="sres()"><div id="r"></div>`;document.getElementById("s").focus()}
function sres(){const v=document.getElementById("s").value.toLowerCase().trim();const r=document.getElementById("r");
 if(v.length<2){r.innerHTML="";return}
 const m=pool(x=>(x.q+" "+x.o.join(" ")).toLowerCase().includes(v));
 r.innerHTML=`<div class="mut" style="margin:8px 0">${m.length} result${m.length===1?"":"s"}${m.length>60?" (showing 60)":""}</div>`+m.slice(0,60).map(x=>`<div class="card">${tags(x)}<div class="q">${esc(x.q)}</div>${pic(x)}<div class="ans">${esc(ansTxt(x))}</div>${x.n?`<div class="note">${esc(x.n)}</div>`:""}</div>`).join("")}
const SRC={hh:{t:"Health Holding exam, solved question bank",f:[["PDF","health-holding-solved.pdf"]]},ecg:{t:"ECG NCLEX-Style Question Bank, Parts 1 and 2 (original practice questions with ECG strips)",f:[["Part 1","ecg-question-bank-part1.pdf"],["Part 2","ecg-question-bank-part2.pdf"]]},east:{t:"Eastern Health Cluster selection exam compilation, April 2025",f:[["DOCX","eastern-cluster-2025.docx"]]}};
document.getElementById("src").innerHTML="<b>Sources</b><ul>"+Object.keys(SRC).map(k=>`<li>${SRC[k].t} (${D.filter(x=>x.r===k).length} questions) · ${SRC[k].f.map(f=>`<a href="${f[1]}" download style="color:var(--ac)">${f[0]}</a>`).join(" · ")}</li>`).join("")+"</ul>";
home();
</script></body></html>
